apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-rtu-dnp3
  namespace: simulator-dnp3
  labels:
    app: simulator-rtu-dnp3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simulator-rtu-dnp3
  template:
    metadata:
      labels:
        app: simulator-rtu-dnp3
    spec:
      imagePullSecrets:
        - name: harbor-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: simulator-rtu-dnp3
          image: 10.14.152.233:8080/scada/simulator-rtu-dnp3:latest
          imagePullPolicy: Always
          args: ["--data", "/data/simulator-data.json", "--http", "0.0.0.0:44015", "--dnp3-port", "40000"]
          ports:
            - name: http
              containerPort: 44015
            - name: dnp3
              containerPort: 40000
          env:
            - name: TZ
              value: Asia/Jakarta
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: simulator-rtu-dnp3
  namespace: simulator-dnp3
  labels:
    app: simulator-rtu-dnp3
spec:
  type: NodePort
  selector:
    app: simulator-rtu-dnp3
  ports:
    - name: dnp3
      port: 40000
      targetPort: dnp3
      nodePort: 30790
    - name: http
      port: 44015
      targetPort: http
      nodePort: 30791
