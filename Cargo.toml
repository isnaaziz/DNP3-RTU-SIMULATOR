[package]
name = "simulator-rtu-dnp3"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
dnp3 = "1.7.0"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
