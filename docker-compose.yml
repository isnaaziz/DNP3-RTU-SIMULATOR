services:
  simulator-rtu-dnp3:
    build: .
    image: simulator-rtu-dnp3:latest
    container_name: simulator-rtu-dnp3
    restart: unless-stopped
    ports:
      - "44015:44015"
      - "40000:40000"
    environment:
      TZ: Asia/Jakarta
    volumes:
      - simulator-data:/data

volumes:
  simulator-data:
